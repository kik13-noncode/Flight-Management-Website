{% extends 'layout/base.html' %}

{% block nav %}

<div class="container mt-5">
    <div class="card shadow-sm border-0 p-4 rounded-3">
        <form method="GET" action="/">
            <div class="row align-items-end g-3">

                <!-- Điểm đi -->
                <div class="col-md-4">
                    <label class="form-label fw-bold">Từ</label>
                    <select class="form-select form-select-lg" name="from_city" required>
                        <option value="" selected disabled>Chọn điểm đi</option>
                        <option value="SG">Sài Gòn (SG)</option>
                        <option value="HN">Hà Nội (HN)</option>
                        <option value="DN">Đà Nẵng (DN)</option>
                    </select>
                </div>

                <!-- Điểm đến -->
                <div class="col-md-4">
                    <label class="form-label fw-bold">Đến</label>
                    <select class="form-select form-select-lg" name="to_city" required>
                        <option value="" selected disabled>Chọn điểm đến</option>
                        <option value="SG">Sài Gòn (SG)</option>
                        <option value="HN">Hà Nội (HN)</option>
                        <option value="DN">Đà Nẵng (DN)</option>
                    </select>
                </div>

                <!-- Ngày đi -->
                <div class="col-md-3">
                    <label class="form-label fw-bold">Ngày khởi hành</label>
                    <input type="date"
                           class="form-control form-control-lg"
                           name="departure_date"
                           required>
                </div>

                <!-- Tìm kiếm -->
                <div class="col-md-1 d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        🔍
                    </button>
                </div>

            </div>
        </form>
    </div>
</div>

{% endblock %}
